version: "3.8"

services:
  # ---- Main Next.js Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vk-messages-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/vk-messages.db
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-secret-in-production}
      - NODE_ENV=production
    volumes:
      - vk-data:/app/data
    networks:
      - vk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- Scheduler Service ----
  scheduler:
    image: node:20-alpine
    container_name: vk-messages-scheduler
    restart: unless-stopped
    working_dir: /app
    command: ["node", "scheduler-node.mjs"]
    environment:
      - MAIN_APP_URL=http://app:3000
      - SCHEDULER_INTERVAL=60000
      - SCHEDULER_PORT=3003
    volumes:
      - ./mini-services/scheduler/scheduler-node.mjs:/app/scheduler-node.mjs:ro
    networks:
      - vk-network
    depends_on:
      app:
        condition: service_healthy

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: vk-messages-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro    # Mount SSL certs here for HTTPS
    networks:
      - vk-network
    depends_on:
      app:
        condition: service_healthy

volumes:
  vk-data:
    driver: local

networks:
  vk-network:
    driver: bridge
